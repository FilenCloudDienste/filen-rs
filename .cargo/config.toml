[build]
rustflags = ["-Zhigher-ranked-assumptions"]

[target.wasm32-unknown-unknown]
rustflags = [
	"-C",
	"target-feature=-nontrapping-fptoint,+atomics,+bulk-memory",
	"-Clink-arg=--shared-memory",
	"-Clink-arg=--max-memory=1073741824",
	"-Clink-arg=--import-memory",
	"-Clink-arg=--export=__wasm_init_tls",
	"-Clink-arg=--export=__tls_size",
	"-Clink-arg=--export=__tls_align",
	"-Clink-arg=--export=__tls_base",
	"--cfg",
	"getrandom_backend=\"wasm_js\"",
]

# aarch64 Linux and Android: unwind tables that hold only at call sites, which is all a panic
# needs, so the epilogue CFI leaves .eh_frame. Not on x86_64, where it saves nothing.
[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = [
	"-Zhigher-ranked-assumptions",
	"-Zuse-sync-unwind=yes",
	"-C",
	"link-arg=--ld-path=wild",
]

[target.aarch64-unknown-linux-musl]
rustflags = ["-Zhigher-ranked-assumptions", "-Zuse-sync-unwind=yes"]

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-Zhigher-ranked-assumptions", "-C", "link-arg=--ld-path=wild"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-Zhigher-ranked-assumptions", "-C", "link-arg=/STACK:2097152"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-Zhigher-ranked-assumptions", "-C", "link-arg=/STACK:2097152"]

# 64 bit Mingw
[target.x86_64-pc-windows-gnu]
rustflags = [
	"-Zhigher-ranked-assumptions",
	"-C",
	"link-arg=-Wl,--stack,2097152",
]

[target.aarch64-linux-android]
rustflags = [
	"-Zhigher-ranked-assumptions",
	"-Zuse-sync-unwind=yes",
	"-C",
	"link-arg=-Wl,-z,max-page-size=16384",
]

[target.x86_64-linux-android]
rustflags = [
	"-Zhigher-ranked-assumptions",
	"-C",
	"link-arg=-Wl,-z,max-page-size=16384",
]

# Apple targets: compact unwind entries for the frames LLVM does not lay out canonically, so
# nearly every function's unwind info goes to __unwind_info instead of __eh_frame. On aarch64 the
# unwind tables also hold only at call sites (-Zuse-sync-unwind), which is all a panic needs; on
# x86_64 that flag grows __text, and the compact unwind flag alone saves more. No [target.<triple>]
# table matches these targets (cargo would join its rustflags with these), so each list repeats
# the build-wide flag.
[target.'cfg(all(target_vendor = "apple", target_arch = "aarch64"))']
rustflags = [
	"-Zhigher-ranked-assumptions",
	"-Zuse-sync-unwind=yes",
	"-Cllvm-args=-emit-compact-unwind-non-canonical",
]

[target.'cfg(all(target_vendor = "apple", target_arch = "x86_64"))']
rustflags = [
	"-Zhigher-ranked-assumptions",
	"-Cllvm-args=-emit-compact-unwind-non-canonical",
]
