name: Continuous Integration
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
jobs:
  ci-linux:
    # also runs clippy on tests, does TOML linting and runs rustfmt
    runs-on: ubuntu-latest
    name: CI on ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-20
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@a84bfdc502f07db5a85dd9d7a30f91a931516cc5
        with:
          shared-key: cargo-build-ci-linux-latest
          prefix-key: ''
          add-rust-environment-hash-key: 'false'
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install C++ Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libc++-dev libc++abi-dev
      # heif-decoder vendors dav1d and builds it from source with meson +
      # ninja (nasm assembles its x86 SIMD). Build scripts run under clippy,
      # and heif-decoder is a workspace member with no `default-members`, so
      # EVERY cargo step below builds it whatever its features say.
      - name: Install build tools for heif-decoder's vendored dav1d
        run: |
          sudo apt-get install -y meson ninja-build nasm
      - name: Install sqlfluff
        run: pip install sqlfluff
      - name: Install Wild linker
        # Must run before the first cargo invocation: .cargo/config.toml routes every native
        # linux-gnu link through Wild, and even clippy links build scripts.
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: wild-linker@0.9.0
        env:
          # On a cache miss the action cargo-installs from the repo checkout, where the same
          # config applies — building Wild would need Wild. Env vars beat config.toml, so
          # restore the stock linker just for this bootstrap build.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: cc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -Zhigher-ranked-assumptions
      - name: Run clippy all features
        run: cargo clippy -F filen-sdk-rs/heif-decoder,filen-sdk-rs/malformed,filen-sdk-rs/multi-threaded-crypto,filen-sdk-rs/cache -- -D warnings
      - name: Run clippy single-threaded
        run: cargo clippy -F filen-sdk-rs/heif-decoder,filen-sdk-rs/malformed --no-default-features -- -D warnings
      - name: Run clippy
        run: cargo clippy -- -D warnings
      - name: Run clippy on tests
        run: cargo clippy --tests -- -D warnings
      - name: Run clippy on tests with cache
        run: cargo clippy --tests -F cache -- -D warnings
      - name: Run rustfmt
        run: cargo fmt --all -- --check
      - name: Install TOML linter
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: taplo-cli@0.10.0
      - name: Run TOML linter and formatter
        run: |
          taplo lint
          taplo fmt --check
      - name: Run sqlfluff
        run: sqlfluff lint .
      - name: Run unit tests
        run: cargo test --lib -F cache --no-fail-fast
        env:
          TEST_EMAIL: 'test@filen.io'
          TEST_PASSWORD: 'testpassword'
          TEST_SHARE_EMAIL: 'test_share@filen.io'
          TEST_SHARE_PASSWORD: 'test_share_password'
          RUST_LOG: debug
      # The binding layers' tests (fs/*/js_impl.rs, js/uniffi.rs) are gated on
      # `uniffi`, which no workspace member turns on, so the step above never
      # builds them. The mobile bindings' features, minus heif-decoder.
      - name: Run unit tests with uniffi
        run: cargo test -p filen-sdk-rs --lib -F uniffi,http-provider,cache --no-fail-fast
        env:
          TEST_EMAIL: 'test@filen.io'
          TEST_PASSWORD: 'testpassword'
          TEST_SHARE_EMAIL: 'test_share@filen.io'
          TEST_SHARE_PASSWORD: 'test_share_password'
          RUST_LOG: debug

  ci-windows:
    runs-on: windows-latest
    name: CI on windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-20
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@a84bfdc502f07db5a85dd9d7a30f91a931516cc5
        with:
          shared-key: cargo-build-ci-windows-latest
          prefix-key: ''
          add-rust-environment-hash-key: 'false'
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # heif-decoder vendors dav1d and builds it from source with meson +
      # ninja, nasm for the x86 SIMD. Build scripts run under clippy, and
      # heif-decoder is a workspace member with no `default-members`, so EVERY
      # cargo step below needs all three, not only the -F heif-decoder ones.
      - name: Install build tools for heif-decoder's vendored dav1d
        run: |
          # meson and ninja come from pip, not choco. choco's meson is an MSI that
          # updates the MACHINE PATH, which a job that is already running never sees:
          # the install step succeeds and `require_build_tool` then finds no meson.
          # pip's console scripts land in a Scripts directory already on the runner's
          # PATH, so there is nothing to refresh and no install location to guess.
          # nasm stays on choco, where the explicit GITHUB_PATH line already works.
          python -m pip install meson ninja
          choco install nasm --no-progress
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH
      - name: Run clippy all features
        run: cargo clippy -F filen-sdk-rs/heif-decoder,filen-sdk-rs/malformed,filen-sdk-rs/multi-threaded-crypto,filen-sdk-rs/cache -- -D warnings
      - name: Run clippy single-threaded
        run: cargo clippy -F filen-sdk-rs/heif-decoder,filen-sdk-rs/malformed --no-default-features -- -D warnings
      - name: Run clippy
        run: cargo clippy -- -D warnings
      - name: Run clippy on tests
        run: cargo clippy --tests -- -D warnings
      - name: Run clippy on tests with cache
        run: cargo clippy --tests -F cache -- -D warnings
      - name: Run unit tests
        run: cargo test --lib -F cache --no-fail-fast
        env:
          TEST_EMAIL: 'test@filen.io'
          TEST_PASSWORD: 'testpassword'
          TEST_SHARE_EMAIL: 'test_share@filen.io'
          TEST_SHARE_PASSWORD: 'test_share_password'
          RUST_LOG: debug

  ci-macos:
    # also runs iOS and Android clippy
    runs-on: macos-latest
    name: CI on macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-20
          components: clippy,rustfmt
          targets: aarch64-apple-ios,aarch64-linux-android
      - uses: Swatinem/rust-cache@a84bfdc502f07db5a85dd9d7a30f91a931516cc5
        with:
          shared-key: cargo-build-ci-macos-latest
          prefix-key: ''
          add-rust-environment-hash-key: 'false'
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Setup Android SDK
        uses: amyu/setup-android@v4
        with:
          sdk-version: 36
          build-tools-version: 35.0.0
          cmake-version: 3.10.2.4988404
          ndk-version: 27.0.12077973
      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: cargo-ndk
      # heif-decoder vendors dav1d and builds it from source with meson +
      # ninja. Build scripts run under clippy, and heif-decoder is a workspace
      # member with no `default-members`, so every cargo step below needs them
      # whatever its features say; no nasm, since this runner and both cross
      # targets are arm64.
      - name: Install build tools for heif-decoder's vendored dav1d
        run: brew install meson ninja
      - name: Run clippy Android
        run: cargo ndk --target aarch64-linux-android clippy -F filen-sdk-rs/malformed,filen-sdk-rs/heif-decoder,filen-sdk-rs/cache -- -D warnings
      - name: Run clippy Android uniffi
        # `cache` included so the cache FFI layer (cache/js_impl.rs) stays checked.
        run: cargo ndk --target aarch64-linux-android clippy -F filen-sdk-rs/malformed,filen-sdk-rs/heif-decoder,filen-sdk-rs/uniffi,filen-sdk-rs/cache -- -D warnings
      - name: Run clippy all features
        run: cargo clippy -F filen-sdk-rs/heif-decoder,filen-sdk-rs/malformed,filen-sdk-rs/multi-threaded-crypto,filen-sdk-rs/cache -- -D warnings
      - name: Run clippy single-threaded
        run: cargo clippy -F filen-sdk-rs/heif-decoder,filen-sdk-rs/malformed --no-default-features -- -D warnings
      - name: Run clippy
        run: cargo clippy -- -D warnings
      - name: Run clippy on tests
        run: cargo clippy --tests -- -D warnings
      - name: Run clippy on tests with cache
        run: cargo clippy --tests -F cache -- -D warnings
      - name: Run clippy iOS
        run: cargo clippy --target aarch64-apple-ios -F filen-sdk-rs/malformed,filen-sdk-rs/heif-decoder,filen-sdk-rs/cache -- -D warnings
      - name: Run clippy iOS uniffi
        # `cache` included so the cache FFI layer (cache/js_impl.rs) stays checked.
        run: cargo clippy --target aarch64-apple-ios -F filen-sdk-rs/malformed,filen-sdk-rs/heif-decoder,filen-sdk-rs/uniffi,filen-sdk-rs/cache -- -D warnings
      - name: Run unit tests
        run: cargo test --lib -F cache --no-fail-fast
        env:
          TEST_EMAIL: 'test@filen.io'
          TEST_PASSWORD: 'testpassword'
          TEST_SHARE_EMAIL: 'test_share@filen.io'
          TEST_SHARE_PASSWORD: 'test_share_password'
          RUST_LOG: debug

  ci-wasm:
    runs-on: macos-latest
    name: CI on wasm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-20
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown, aarch64-linux-android, x86_64-linux-android, aarch64-apple-ios, aarch64-apple-ios-sim
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Setup Android SDK
        uses: amyu/setup-android@v4
        with:
          sdk-version: 36
          build-tools-version: 35.0.0
          cmake-version: 3.10.2.4988404
          ndk-version: 27.0.12077973
      - uses: Swatinem/rust-cache@a84bfdc502f07db5a85dd9d7a30f91a931516cc5
        with:
          shared-key: cargo-build-ci-wasm
          prefix-key: ''
          add-rust-environment-hash-key: 'false'
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          # waiting on a new release that includes
          # https://github.com/wasm-bindgen/wasm-pack/pull/1428
          tool: wasm-pack
          git: https://github.com/wasm-bindgen/wasm-pack
          rev: cd1718aa7babb656796b8aae3c177ddacce28028
      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: cargo-ndk
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Install LLVM clang (wasm32 C objects for the cache's bundled SQLite)
        run: brew install llvm
      # heif-decoder builds its vendored dav1d with meson + ninja on every
      # target, and `npm run ubrn:release` below builds the x86_64 Android
      # slice, whose SIMD nasm assembles.
      - name: Install build tools for heif-decoder's vendored dav1d
        run: brew install meson ninja nasm
      # wasm-pack.sh refuses to run without this: heif-decoder cross-compiles
      # libheif/libde265/dav1d for wasm32 against wasi-sdk's sysroot, there
      # being no host C++ runtime for wasm32-unknown-unknown.
      - name: Install wasi-sdk (heif-decoder's wasm C++ toolchain)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/wasi-sdk.tar.gz" \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-arm64-macos.tar.gz
          mkdir -p "$HOME/wasi-sdk"
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$HOME/wasi-sdk" --strip-components=1
          echo "WASI_SDK_PATH=$HOME/wasi-sdk" >> "$GITHUB_ENV"
      # With `heif-decoder`, which is what wasm-pack.sh ships — the WASI
      # link-time stubs, the `Once`-guarded `__wasm_call_ctors` and the
      # DecodeOptions probe are wasm-only code and nothing else lints them.
      - name: Run clippy wasm-full
        run: cargo clippy --target wasm32-unknown-unknown -F wasm-full,cache,heif-decoder -- -D warnings
        working-directory: ./filen-sdk-rs
        env:
          CC_wasm32_unknown_unknown: /opt/homebrew/opt/llvm/bin/clang
          AR_wasm32_unknown_unknown: /opt/homebrew/opt/llvm/bin/llvm-ar
      # As wasm-pack.sh ships it: default features OFF (they pull in the
      # threaded runtime the service worker does not have), `heif-decoder` on,
      # and the same RUSTFLAGS. Linting any other combination lints a
      # configuration nothing ever ships.
      - name: Run clippy service-worker
        run: cargo clippy --target wasm32-unknown-unknown --no-default-features -F service-worker,heif-decoder -- -D warnings
        working-directory: ./filen-sdk-rs
        env:
          RUSTFLAGS: -C target-feature=-nontrapping-fptoint,+bulk-memory --cfg getrandom_backend="wasm_js"
      - name: Run rustfmt in filen-wasm
        run: cargo fmt -- --check
        working-directory: ./filen-sdk-rs
      - name: Build WASM bundle
        run: sh wasm-pack.sh
        working-directory: ./filen-sdk-rs
      - name: Install dependencies
        run: npm install --package-lock-only && npm ci
        working-directory: ./filen-sdk-rs/web
      - name: Build React Native Bundle
        run: npm run ubrn:release
        working-directory: ./filen-sdk-rs/web
