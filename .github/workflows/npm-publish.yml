name: Publish to npm

on:
  push:
    tags:
      - 'filen-js@*'
  workflow_dispatch:

# Allow one concurrent deployment
concurrency:
  group: 'npm'
  cancel-in-progress: true

jobs:
  build-napi:
    # The desktop Node-API addon, one per target in web/package.json's `napi.targets`, each
    # published below as @filen/sdk-rs-<platform>: the packages the addon's loader falls back to
    # when node/ holds no binary for its host. Package-scoped (--manifest-path ../Cargo.toml), so
    # no heif-decoder tooling. Each leg builds on the OS it targets, so every addon links as
    # ci-napi's do (dynamic_lookup on macOS, -z nodelete on linux-gnu, msvc on Windows); the
    # arm64 Windows and Linux and the x86_64 macOS addons are cross-compiled from the x86_64 and
    # arm64 runners, as napi-rs builds them, and only the legs whose host can load the addon
    # smoke-test it.
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            smoke-test: true
            # The loader and the typings do not depend on the target; this leg hands them to
            # the publish job.
            loader: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            smoke-test: true
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            smoke-test: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    name: Build the napi addon (${{ matrix.target }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-20
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@a84bfdc502f07db5a85dd9d7a30f91a931516cc5
        with:
          shared-key: cargo-build-napi-release-${{ matrix.target }}
          prefix-key: ''
          add-rust-environment-hash-key: 'false'
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Install dependencies
        run: npm ci
        working-directory: ./filen-sdk-rs/web
      - name: Build the napi addon
        shell: bash
        run: |
          # On linux-gnu the addon is linked against @napi-rs/cross-toolchain's glibc 2.17
          # sysroot (--use-napi-cross), so it loads on older distributions than the runner. That
          # toolchain links with its own gcc, which rejects the Wild flag .cargo/config.toml
          # gives these targets: RUSTFLAGS replaces the config's list (a
          # CARGO_TARGET_<triple>_RUSTFLAGS would be appended to it). It is set only for them,
          # since even an empty value would drop the other targets' flags too.
          if [[ $target == *-linux-gnu ]]; then
            export RUSTFLAGS=-Zhigher-ranked-assumptions
            # The toolchain's aarch64 gcc predates the __ARM_ARCH predefine that ring's assembly
            # checks for, so the build states it (ARMv8, the only aarch64 profile).
            export CFLAGS_aarch64_unknown_linux_gnu=-D__ARM_ARCH=8
            npm run build:napi:release -- --target "$target" --use-napi-cross
          else
            npm run build:napi:release -- --target "$target"
          fi
        working-directory: ./filen-sdk-rs/web
        env:
          target: ${{ matrix.target }}
      - name: Smoke-test the napi addon
        if: matrix.smoke-test
        run: node --test napi/smoke.test.mjs
        working-directory: ./filen-sdk-rs/web
      - name: Upload the napi addon
        uses: actions/upload-artifact@v4
        with:
          name: napi-binary-${{ matrix.target }}
          path: ./filen-sdk-rs/web/node/sdk-rs.*.node
          if-no-files-found: error
      - name: Upload the napi loader and typings
        if: matrix.loader
        uses: actions/upload-artifact@v4
        with:
          name: napi-loader
          path: |
            ./filen-sdk-rs/web/node/index.js
            ./filen-sdk-rs/web/node/index.d.ts
          if-no-files-found: error

  build:
    needs: build-napi
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-20
          targets: wasm32-unknown-unknown, aarch64-linux-android, x86_64-linux-android, aarch64-apple-ios, aarch64-apple-ios-sim
          components: llvm-tools
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Setup Android SDK
        uses: amyu/setup-android@v4
        with:
          sdk-version: 36
          build-tools-version: 35.0.0
          cmake-version: 3.10.2.4988404
          ndk-version: 27.0.12077973
      - name: Install LLVM clang (wasm32 C objects for the cache's bundled SQLite)
        run: brew install llvm
      # heif-decoder builds its vendored dav1d with meson + ninja on every
      # target, and `npm run ubrn:release` below builds the x86_64 Android
      # slice, whose SIMD nasm assembles.
      - name: Install build tools for heif-decoder's vendored dav1d
        run: brew install meson ninja nasm
      # wasm-pack.sh refuses to run without this: heif-decoder cross-compiles
      # libheif/libde265/dav1d for wasm32 against wasi-sdk's sysroot, there
      # being no host C++ runtime for wasm32-unknown-unknown.
      - name: Install wasi-sdk (heif-decoder's wasm C++ toolchain)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/wasi-sdk.tar.gz" \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-arm64-macos.tar.gz
          mkdir -p "$HOME/wasi-sdk"
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$HOME/wasi-sdk" --strip-components=1
          echo "WASI_SDK_PATH=$HOME/wasi-sdk" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@a84bfdc502f07db5a85dd9d7a30f91a931516cc5
        with:
          shared-key: cargo-build-ci-wasm
          prefix-key: ''
          add-rust-environment-hash-key: 'false'
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          # waiting on a new release that includes
          # https://github.com/wasm-bindgen/wasm-pack/pull/1428
          tool: wasm-pack
          git: https://github.com/wasm-bindgen/wasm-pack
          rev: cd1718aa7babb656796b8aae3c177ddacce28028
      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: cargo-ndk
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Build WASM bundle
        run: sh wasm-pack.sh
        working-directory: ./filen-sdk-rs
      - name: Install dependencies
        run: npm install --package-lock-only && npm ci
        working-directory: ./filen-sdk-rs/web
      - name: Build React Native Bundle
        run: npm run ubrn:release
        working-directory: ./filen-sdk-rs/web
      # Embedded bitcode (__LLVM,__bitcode) is ~200 MB per static library and pushes the tarball
      # past the registry's upload limit (413). Nothing links or reads it since Apple dropped
      # bitcode; the machine code, symbols and debug info stay. Rust's llvm-objcopy, because the
      # runner's Xcode `strip` leaves the section in place.
      - name: Remove embedded bitcode from the iOS static libraries
        run: |
          set -- FilenSdkRsFramework.xcframework/*/libfilen_sdk_rs.a
          [ -f "$1" ] || { echo "no static libraries found" >&2; exit 1; }
          objcopy="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/llvm-objcopy"
          for lib in "$@"; do "$objcopy" --remove-section=__LLVM,__bitcode "$lib"; done
          du -h "$@"
        working-directory: ./filen-sdk-rs/web
      - name: Download the napi addons
        uses: actions/download-artifact@v4
        with:
          pattern: napi-binary-*
          path: ./filen-sdk-rs/web/artifacts
      - name: Download the napi loader and typings
        uses: actions/download-artifact@v4
        with:
          name: napi-loader
          path: ./filen-sdk-rs/web/node
      - name: Lay out the per-platform napi packages
        # One npm/<platform>/ package per target, at the package's version, each holding its
        # addon. The addons are also copied next to package.json, where `files` leaves them out.
        run: npx napi create-npm-dirs && npx napi artifacts
        working-directory: ./filen-sdk-rs/web
      - name: Configure npm for publishing
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_PUBLISH_TOKEN }}" > ~/.npmrc
      - name: Publish the per-platform napi packages
        # Publishes each npm/<platform>/ package (a version already on the registry is skipped,
        # so a rerun after a failed publish goes on) and lists them all in package.json's
        # optionalDependencies, at the same version, for the publish below. No GitHub release.
        run: npx napi pre-publish --no-gh-release
        working-directory: ./filen-sdk-rs/web
        env:
          # Scoped packages are published restricted unless told otherwise.
          npm_config_access: public
      - name: Publish
        run: npm publish --access public
        working-directory: ./filen-sdk-rs/web
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
      - name: Cleanup
        run: rm -rf ~/.npmrc
