name: Tests
on:
  # Run at 2 AM CEST every day
  schedule:
    - cron: '0 0 * * *'

  # Allow manual triggering from GitHub UI
  workflow_dispatch:

  # Run on push if commit message contains [test]
  push:
    branches: ['**']

  # Run on PR if title or description contains [test]
  pull_request:
    branches: ['**']

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[test]') ||
      contains(github.event.pull_request.title, '[test]') ||
      contains(github.event.pull_request.body, '[test]')
    strategy:
      # One dead or failing leg must not cancel the others: fail-fast wiped the whole
      # nightly signal whenever a single runner was lost, and kept cancelling the slow
      # Windows legs before they could report their own (Windows-only) failures.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        version: [V1, V2] # This remains to define which version of the secrets to use
    runs-on: ${{ matrix.os }}
    # Healthy legs finish in ~3h25m; a runner that is still going at 4.5h is wedged.
    # Fail it with a clear timeout instead of waiting for GitHub's opaque 6h kill
    # ("runner lost communication").
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-20
      - uses: Swatinem/rust-cache@a84bfdc502f07db5a85dd9d7a30f91a931516cc5
        with:
          shared-key: cargo-build-test-${{ matrix.os }}
          prefix-key: ''
          add-rust-environment-hash-key: 'false'
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install C++ Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libc++-dev libc++abi-dev
      # heif-decoder vendors dav1d and builds it from source with meson +
      # ninja (nasm assembles its x86 SIMD). `Run tests` below runs at the
      # workspace root, which builds heif-decoder whatever the features say,
      # and its build script asserts on all three.
      - name: Install build tools for heif-decoder's vendored dav1d (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y meson ninja-build nasm
      - name: Install build tools for heif-decoder's vendored dav1d (windows)
        if: runner.os == 'Windows'
        run: |
          # meson and ninja come from pip, not choco. choco's meson is an MSI that
          # updates the MACHINE PATH, which a job that is already running never sees:
          # the install step succeeds and `require_build_tool` then finds no meson.
          # pip's console scripts land in a Scripts directory already on the runner's
          # PATH, so there is nothing to refresh and no install location to guess.
          # nasm stays on choco, where the explicit GITHUB_PATH line already works.
          python -m pip install meson ninja
          choco install nasm --no-progress
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH
      - name: Remove the broken fusermount3 shadow (actions/runner-images#14516)
        if: runner.os == 'Linux'
        run: |
          # Image ubuntu24/20260804.265 ships a stray non-setuid, world-writable
          # /usr/local/bin/fusermount3 that shadows the real setuid helper via PATH and
          # breaks unprivileged FUSE mounts (rclone: "fusermount3: mount failed:
          # Operation not permitted"). Harmless no-op once the image is fixed.
          if [ -e /usr/local/bin/fusermount3 ]; then
            sudo rm /usr/local/bin/fusermount3
          fi
      - name: Install WinFsp (rclone mount backend for network-drive tests)
        if: runner.os == 'Windows'
        run: choco install winfsp -y
      # No nasm: macos-latest is arm64, and dav1d only assembles SIMD on x86.
      - name: Install build tools for heif-decoder's vendored dav1d (macos)
        if: runner.os == 'macOS'
        run: brew install meson ninja
      - name: Install Wild linker
        if: runner.os == 'Linux'
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: wild-linker@0.9.0
        env:
          # Env beats .cargo/config.toml: a cache-miss cargo install runs in the repo
          # checkout, which would otherwise need Wild to build Wild.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: cc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -Zhigher-ranked-assumptions
      # Hypothetical fix, NOT yet confirmed: hold Windows Update off for the run.
      #
      # The nightly Windows legs die with "The hosted runner lost communication
      # with the server" and no job log on every night where the runner image is a
      # cumulative update behind AND the leg is still running past ~03:23 UTC. On
      # 2026-09-16 the V1 leg finished at 03:23:12 on a stale image and passed
      # while V2, same image, died — so the trigger follows the clock, not the
      # workload.
      #
      # Probing a live runner showed how that is possible: the image build
      # disables Windows Update, but none of that survives onto the deployed VM.
      # wuauserv runs, the AU policy key is empty, Automatic Maintenance is back,
      # the UpdateOrchestrator scan tasks are Ready, the clock is UTC, and the
      # current cumulative update is on offer (KB5122871, build 26100.33438, while
      # the image is 26100.33296). With no AU policy in place the default is
      # install-and-restart at 3 AM local, which here is 03:00 UTC.
      #
      # So put the image's own lockdown back for the life of the job. If the
      # Windows legs then survive a stale-image night, the cause is confirmed and
      # this step is the fix; if they still die, the cause is outside the VM and
      # this step should come out again. It reports what it actually managed to
      # change, because a silent failure would make a surviving night meaningless.
      - name: Hold off Windows Update (nightly Windows legs die around 03:00 UTC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $au = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
          $maint = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\Maintenance'
          New-Item -Path $au -Force | Out-Null
          New-Item -Path $maint -Force | Out-Null
          Set-ItemProperty -Path $au -Name NoAutoUpdate -Value 1 -Type DWord
          Set-ItemProperty -Path $au -Name AUOptions -Value 1 -Type DWord
          Set-ItemProperty -Path $maint -Name MaintenanceDisabled -Value 1 -Type DWord

          foreach ($svc in 'wuauserv', 'UsoSvc', 'WaaSMedicSvc') {
            Stop-Service $svc -Force -ErrorAction SilentlyContinue
            Set-Service $svc -StartupType Disabled -ErrorAction SilentlyContinue
            # Set-Service is refused on some protected services; the service key is
            # the fallback the image build itself uses (Start = 4 is disabled).
            Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\$svc" -Name Start -Value 4 -ErrorAction SilentlyContinue
          }

          '\Microsoft\Windows\UpdateOrchestrator\', '\Microsoft\Windows\WindowsUpdate\' | ForEach-Object {
            Get-ScheduledTask -TaskPath $_ -ErrorAction SilentlyContinue |
              Disable-ScheduledTask -ErrorAction SilentlyContinue | Out-Null
          }

          # Read back what took effect rather than assuming it did.
          Get-Service wuauserv, UsoSvc, WaaSMedicSvc |
            Select-Object Name, Status, StartType | Out-String -Width 120 | Write-Host
          Get-ItemProperty -Path $au | Select-Object NoAutoUpdate, AUOptions |
            Out-String -Width 120 | Write-Host
          Get-ScheduledTask -TaskPath '\Microsoft\Windows\UpdateOrchestrator\' -ErrorAction SilentlyContinue |
            Select-Object TaskName, State | Out-String -Width 120 | Write-Host
      - name: Run tests
        run: cargo test -F filen-sdk-rs/malformed,filen-sdk-rs/heif-decoder --no-fail-fast
        env:
          TEST_EMAIL: ${{ secrets[format('{0}_TEST_ACC_EMAIL', matrix.version)] }}
          TEST_PASSWORD: ${{ secrets[format('{0}_TEST_ACC_PASS', matrix.version)] }}
          TEST_SHARE_EMAIL: ${{ secrets['V2_SHARE_ACC_EMAIL'] }}
          TEST_SHARE_PASSWORD: ${{ secrets['V2_SHARE_ACC_PASS'] }}
          IMAP_EMAIL_USER: ${{ secrets['IMAP_EMAIL_USER'] }}
          IMAP_EMAIL_PASSWORD: ${{ secrets['IMAP_EMAIL_PASSWORD'] }}
          # Authenticates the updater tests' api.github.com calls: the unauthenticated
          # 60 req/hr/IP budget is shared across every tenant of a runner IP and its
          # exhaustion failed test_updater on 07-31 and 08-08.
          GITHUB_TOKEN: ${{ github.token }}
          RUST_LOG: debug
  test-2fa:
    # `test_2fa` is #[ignore]'d out of the matrix above because it ENABLES 2FA on the shared
    # account, which makes EVERY concurrent login to that account fail (the other matrix jobs, and
    # other workers). Run it ISOLATED here: only AFTER the whole matrix finishes (needs: test, so
    # nothing else is touching the account) and only on Linux, via the ignored test. Default
    # features only — the test needs neither malformed nor heif, so there are no system deps to
    # install. `version` mirrors the matrix so 2FA coverage is preserved for each auth version
    # (V1/V2 use different accounts, so the two are safe to run concurrently with each other).
    needs: test
    if: |
      !cancelled() && (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.head_commit.message, '[test]') ||
        contains(github.event.pull_request.title, '[test]') ||
        contains(github.event.pull_request.body, '[test]')
      )
    strategy:
      matrix:
        version: [V1, V2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-20
      - uses: Swatinem/rust-cache@a84bfdc502f07db5a85dd9d7a30f91a931516cc5
        with:
          shared-key: cargo-build-test-ubuntu-latest
          prefix-key: ''
          add-rust-environment-hash-key: 'false'
          save-if: false
      - name: Install Wild linker
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: wild-linker@0.9.0
        env:
          # Env beats .cargo/config.toml: a cache-miss cargo install runs in the repo
          # checkout, which would otherwise need Wild to build Wild.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: cc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -Zhigher-ranked-assumptions
      - name: Run the isolated 2FA test (#[ignore]'d out of the matrix)
        run: cargo test -p filen-sdk-rs --test client_tests --no-fail-fast -- --ignored
        env:
          TEST_EMAIL: ${{ secrets[format('{0}_TEST_ACC_EMAIL', matrix.version)] }}
          TEST_PASSWORD: ${{ secrets[format('{0}_TEST_ACC_PASS', matrix.version)] }}
          TEST_SHARE_EMAIL: ${{ secrets['V2_SHARE_ACC_EMAIL'] }}
          TEST_SHARE_PASSWORD: ${{ secrets['V2_SHARE_ACC_PASS'] }}
          IMAP_EMAIL_USER: ${{ secrets['IMAP_EMAIL_USER'] }}
          IMAP_EMAIL_PASSWORD: ${{ secrets['IMAP_EMAIL_PASSWORD'] }}
          RUST_LOG: debug
  test-wasm:
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[test]') ||
      contains(github.event.pull_request.title, '[test]') ||
      contains(github.event.pull_request.body, '[test]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-20
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@a84bfdc502f07db5a85dd9d7a30f91a931516cc5
        with:
          shared-key: cargo-build-test-wasm
          prefix-key: ''
          add-rust-environment-hash-key: 'false'
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install LLVM clang (wasm32 C objects for the cache's bundled SQLite)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm
          echo "CC_wasm32_unknown_unknown=$(command -v clang)" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=$(command -v llvm-ar)" >> "$GITHUB_ENV"
      # heif-decoder builds its vendored dav1d with meson + ninja on every
      # target; wasm has no SIMD path in dav1d, so no nasm here.
      - name: Install build tools for heif-decoder's vendored dav1d
        run: sudo apt-get install -y meson ninja-build
      # wasm-pack.sh refuses to run without this: heif-decoder cross-compiles
      # libheif/libde265/dav1d for wasm32 against wasi-sdk's sysroot, there
      # being no host C++ runtime for wasm32-unknown-unknown.
      - name: Install wasi-sdk (heif-decoder's wasm C++ toolchain)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/wasi-sdk.tar.gz" \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz
          mkdir -p "$HOME/wasi-sdk"
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$HOME/wasi-sdk" --strip-components=1
          echo "WASI_SDK_PATH=$HOME/wasi-sdk" >> "$GITHUB_ENV"
      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          # waiting on a new release that includes
          # https://github.com/wasm-bindgen/wasm-pack/pull/1428
          tool: wasm-pack
          git: https://github.com/wasm-bindgen/wasm-pack
          rev: cd1718aa7babb656796b8aae3c177ddacce28028
        env:
          # Env beats .cargo/config.toml: a cache-miss cargo install runs in the repo
          # checkout, where the config demands Wild — and this job never installs Wild.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: cc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -Zhigher-ranked-assumptions
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Package WASM bundle
        run:
          | # we use the bundler target because vitest doesn't seem to be able to work with the web target (see https://github.com/vitest-dev/vitest/discussions/4283)
          sh wasm-pack.sh
        working-directory: ./filen-sdk-rs
      - name: Run TS tests
        # we're waiting on https://github.com/RReverser/wasm-bindgen-rayon/issues/32
        # for webkit/safari support
        run: |
          npm install
          npx playwright install --with-deps
          npm run test
        working-directory: ./filen-sdk-rs/web
        env:
          VITE_TEST_EMAIL: ${{ secrets['V2_TEST_ACC_EMAIL'] }}
          VITE_TEST_PASSWORD: ${{ secrets['V2_TEST_ACC_PASS'] }}
          VITE_TEST_SHARE_EMAIL: ${{ secrets['V2_SHARE_ACC_EMAIL'] }}
          VITE_TEST_SHARE_PASSWORD: ${{ secrets['V2_SHARE_ACC_PASS'] }}
          # Multiplies every test timeout (3 min by default): every upload here waits on
          # the same drive-write lock the native legs churn for the whole run.
          VITE_TEST_TIMEOUT_MULT: '10'
