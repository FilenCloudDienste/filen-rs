[workspace]
resolver = "2"
members = [
	"filen-mobile-native-cache",
	"filen-sdk-rs",
	"filen-types",
	"filen-macros",
	"heif-decoder",
	"microthumb",
	"test-utils",
	"uniffi-bindgen",
	"uniffi-bindgen-swift",
	"filen-cli",
	"filen-cloud-files",
]

# Every member opts in with `[lints] workspace = true`; a new crate must too.
[workspace.lints.rust]
# New unsafe needs the maintainer's approval (see CLAUDE.md, Contributing). The existing
# sites carry an #[allow(unsafe_code)] that says what the unsafe is for.
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
# Module files are named after their directory: foo/mod.rs, not foo.rs next to foo/.
self_named_module_files = "deny"
# The rest had existing hits; each one carries an #[allow] whose comment gives the reason.
option_option = "deny"
struct_excessive_bools = "deny"
string_slice = "deny"
# No exceptions: every cast that could truncate is rewritten (T::try_from, or
# num_traits::ToPrimitive from a float), and the diff policy blocks an allow of this lint.
# It cannot be "forbid": clap's derive carries #[allow(clippy::pedantic)], which a forbid
# turns into error E0453, and so does every function a #[wasm_bindgen] extern block imports.
cast_possible_truncation = "deny"

[profile.test]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1

# The CLI's release binaries carry no symbol table: it was a fifth of their size, and nothing
# reads it. The other release artifacts (the mobile library, the napi addon) keep theirs.
[profile.release.package.filen-cli]
strip = "symbols"

[profile.web-release]
inherits = "release"
opt-level = "s"

# filen-cli's cold third-party code at opt-level z: argument parsing and completions, the HTML
# docs and their local server, prompts and the terminal, YAML, the self-signed certificate for
# `serve`, the keyring, self-update, version comparison, log files and size formatting. None of it
# is on a transfer, crypto or cache path. Each crate listed is filen-cli's alone, or reaches the
# mobile library and the napi addon only as code that never runs there (clap and semver, through
# uniffi's bindgen and napi-derive's macros). chrono and tracing-subscriber stay at 3: the SDK
# decodes timestamps and logs through them on every platform.
[profile.release.package.clap]
opt-level = "z"

[profile.release.package.clap_builder]
opt-level = "z"

[profile.release.package.clap_lex]
opt-level = "z"

[profile.release.package.clap_complete]
opt-level = "z"

[profile.release.package.comrak]
opt-level = "z"

[profile.release.package.inquire]
opt-level = "z"

[profile.release.package.crossterm]
opt-level = "z"

[profile.release.package.serde_yaml]
opt-level = "z"

[profile.release.package.unsafe-libyaml]
opt-level = "z"

[profile.release.package.tiny_http]
opt-level = "z"

[profile.release.package.rcgen]
opt-level = "z"

[profile.release.package.yasna]
opt-level = "z"

[profile.release.package.keyring]
opt-level = "z"

[profile.release.package.self-replace]
opt-level = "z"

[profile.release.package.semver]
opt-level = "z"

[profile.release.package.ftail]
opt-level = "z"

[profile.release.package.humansize]
opt-level = "z"

[profile.release.package.tiny-gradient]
opt-level = "z"

# The CLI's release binaries (release-cli.yml, filen-cli/Dockerfile) are built for size, with
# the crates a transfer spends its time in kept at 3: the SDK itself and the crypto it runs over
# every chunk and every login (AES-GCM with GHASH and POLYVAL, ChaCha20, the SHA-1, SHA-2, MD5 and
# BLAKE3 hashes, HMAC, Argon2 and PBKDF2, ring under rustls, and the RustCrypto traits they are
# built on). A stanza names a package, so it covers every version of it in Cargo.lock. The
# profile inherits release's package overrides too, so the cold crates above stay at z. The
# release profile itself is unchanged: the mobile library and the napi addon build with it.
[profile.cli-release]
inherits = "release"
opt-level = "s"

[profile.cli-release.package.filen-sdk-rs]
opt-level = 3

[profile.cli-release.package.aes]
opt-level = 3

[profile.cli-release.package.aes-gcm]
opt-level = 3

[profile.cli-release.package.ghash]
opt-level = 3

[profile.cli-release.package.polyval]
opt-level = 3

[profile.cli-release.package.sha2]
opt-level = 3

[profile.cli-release.package.sha1]
opt-level = 3

[profile.cli-release.package.blake3]
opt-level = 3

[profile.cli-release.package.argon2]
opt-level = 3

[profile.cli-release.package.pbkdf2]
opt-level = 3

[profile.cli-release.package.ring]
opt-level = 3

[profile.cli-release.package.chacha20]
opt-level = 3

[profile.cli-release.package.hmac]
opt-level = 3

[profile.cli-release.package.md-5]
opt-level = 3

[profile.cli-release.package.cipher]
opt-level = 3

[profile.cli-release.package.ctr]
opt-level = 3

[profile.cli-release.package.universal-hash]
opt-level = 3

[profile.cli-release.package.cpufeatures]
opt-level = 3

[profile.cli-release.package.digest]
opt-level = 3

[profile.cli-release.package.block-buffer]
opt-level = 3
