[workspace]
resolver = "2"
members = [
	"filen-mobile-native-cache",
	"filen-sdk-rs",
	"filen-types",
	"filen-macros",
	"heif-decoder",
	"microthumb",
	"test-utils",
	"uniffi-bindgen",
	"uniffi-bindgen-swift",
	"filen-cli",
	"filen-rclone-wrapper",
]

# Every member opts in with `[lints] workspace = true`; a new crate must too.
[workspace.lints.rust]
# New unsafe needs the maintainer's approval (see CLAUDE.md, Contributing). The existing
# sites carry an #[allow(unsafe_code)] that says what the unsafe is for.
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
# Module files are named after their directory: foo/mod.rs, not foo.rs next to foo/.
self_named_module_files = "deny"
# The rest had existing hits; each one carries an #[allow] whose comment gives the reason.
option_option = "deny"
struct_excessive_bools = "deny"
string_slice = "deny"
# No exceptions: every cast that could truncate is rewritten (T::try_from, or
# num_traits::ToPrimitive from a float), and the diff policy blocks an allow of this lint.
# It cannot be "forbid": clap's derive carries #[allow(clippy::pedantic)], which a forbid
# turns into error E0453, and so does every function a #[wasm_bindgen] extern block imports.
cast_possible_truncation = "deny"

[profile.test]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1

[profile.web-release]
inherits = "release"
opt-level = "s"
