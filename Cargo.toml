[workspace]
resolver = "2"
members = [
	"filen-mobile-native-cache",
	"filen-sdk-rs",
	"filen-types",
	"filen-macros",
	"heif-decoder",
	"microthumb",
	"test-utils",
	"uniffi-bindgen",
	"uniffi-bindgen-swift",
	"filen-cli",
	"filen-rclone-wrapper",
	"filen-sync-core",
]
# crates vendored with a patch of ours, built as dependencies only (see each one's VENDORED.md)
exclude = ["filen-sdk-rs/vendor"]

[profile.test]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1

[profile.web-release]
inherits = "release"
opt-level = "s"

# ruzstd 0.9.0 with a bound on what one block decodes to; see
# filen-sdk-rs/vendor/ruzstd/VENDORED.md
[patch.crates-io]
ruzstd = { path = "filen-sdk-rs/vendor/ruzstd" }
