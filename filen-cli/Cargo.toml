[package]
name = "filen-cli"
version = "0.2.9"
authors = ["FilenCloudDienste"]
edition = "2024"
repository = "https://github.com/FilenCloudDienste/filen-rs"
license = "AGPL-3.0"
metadata.workspaces = { independent = true }

[dependencies]
anyhow = "1.0.98"
# "string": the completion script is generated from a copy of the command without its hidden
# options, which takes the names from the original as owned strings
clap = { version = "4.5.53", features = ["derive", "env", "string"] }
filen-sdk-rs = { path = "../filen-sdk-rs", features = [
	"cache",
	"sync-engine",
	"rclone-managed",
] }
filen-types = { path = "../filen-types" }
filen-macros = { path = "../filen-macros" }
log = "0.4.27"
# The CLI keeps its own `log`-based logger (CustomLogger); the `log` feature bridges the SDK's
# tracing events into `log` so they still surface here.
tracing = { version = "0.1", features = ["log"] }
shlex = "1.3.0"
tokio = { version = "1.47.1", features = [
	"rt-multi-thread",
	"macros",
	# `upload -` reads stdin, `download <file> -` writes stdout
	"io-std",
	"process",
	"signal",
	"time",
] }
keyring = { version = "3", features = [
	"apple-native",
	"windows-native",
	"sync-secret-service",
	"vendored",
	"crypto-rust",
] }
serde = "1.0.219"
serde_json = "1.0.142"
serde_yaml = "0.9.34"
base64 = "0.22.1"
tiny-gradient = "0.1.0"
termsize = "0.1.9"
humansize = "2.1.3"
chrono = { version = "0.4.41", features = ["serde"] }
unicode-width = "0.2.1"
ansi-width = "0.1.0"
# Without its file channels, which panic when another process moves or deletes a log file;
# `LogFiles` writes the log files.
ftail = { version = "0.3.1", default-features = false }
dirs = "6.0.0"
reqwest = { version = "0.12.22", features = [
	"rustls-tls",
], default-features = false }
self-replace = "1.5.0"
tempfile = "3.23.0"
anstyle = "1.0.13"
semver = "1.0.27"
# checks a downloaded update against the SHA-256 digest its release lists
sha2 = "0.11.0"
# `serve --self-signed`'s certificate, signed with ring, which rustls already brings. Pinned below
# 0.14.10, whose pem 4 would add a second major of base64.
rcgen = { version = "=0.14.9", default-features = false, features = [
	"crypto",
	"pem",
	"ring",
] }
comrak = { version = "0.52.0", default-features = false, features = [
	"bon",
] } # needed to remove feature "clap", since it would cause clap_builder's dependency "terminal_size" to be included, which would make ugly line breaks in the help rendering
tiny_http = "0.12.0"
port_check = "0.3.0"
open = "5.3.5"
clap_complete = { version = "4.5.65", features = ["unstable-dynamic"] }
strum = { version = "0.28.0", features = ["derive"] }
# we're using this fork of inquire, which contains history functionality (copied from an unmerged PR to upstream https://github.com/mikaelmello/inquire/pull/229)
# as well as more input actions and async autocompletion (which is implemented quite hackily)
# todo: might merge this upstream in the future
# pinned to the commit of its async-autocomplete branch that Cargo.lock had resolved
inquire = { git = "https://github.com/JupiterPi/inquire.git", rev = "d8810e58076f7726fc7a30249f6ee0debe7ad4ce" }
console = "0.16.4"
ctrlc = "3.5.2"
futures = "0.3.34"
# expands the wildcards of upload sources where no shell does (Windows, the REPL, piped commands)
globset = { version = "0.4.18", default-features = false }
# The uuid (v5) the TypeScript CLI named a sync pair's state directory by
sha1 = "0.11.0"

[dev-dependencies]
test-utils = { path = "../test-utils", features = ["cli"] }
# the tests put directories whose names cannot be decrypted on the server
filen-sdk-rs = { path = "../filen-sdk-rs", features = ["malformed"] }
assert_cmd = "2.1.1"
assert_fs = "1.1.3"
dotenv = "0.15.0"
predicates = "3.1.3"
rand = "0.10.3"
insta = "1.44.3"
regex = "1.12.2"
manuel = { git = "https://github.com/JupiterPi/manuel", rev = "cf09d23fabdd7ef64567b751210292b2bf7b16da" }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
# glibc's malloc tuning, see src/memory.rs
libc = "0.2.188"

[features]
default = []
is_docker = []
# Test-only: builds the test targets that log into the test account. Every one of them shares the
# account's drive-write lock, so CI runs them in a job of their own, one after the other, instead
# of in the concurrent test matrix, which builds without it. The other targets need no account.
# Cargo discovers every tests/*.rs on its own and builds it without the feature unless a `[[test]]`
# entry below says otherwise, so a new target that logs in must get an entry here. (`autotests =
# false` would not make that the default: it would leave an unlisted file unbuilt everywhere.)
cli-live-tests = []

[[test]]
name = "account_tests"
required-features = ["cli-live-tests"]

[[test]]
name = "auth_tests"
required-features = ["cli-live-tests"]

[[test]]
name = "commands_tests"
required-features = ["cli-live-tests"]

[[test]]
name = "completion_tests"
required-features = ["cli-live-tests"]

[[test]]
name = "fs_tests"
required-features = ["cli-live-tests"]

[[test]]
name = "manuel_tests"
required-features = ["cli-live-tests"]

[[test]]
name = "misc_tests"
required-features = ["cli-live-tests"]

[[test]]
name = "notes_tests"
required-features = ["cli-live-tests"]

[[test]]
name = "qa_commands_tests"
required-features = ["cli-live-tests"]

[[test]]
name = "qa_output_tests"
required-features = ["cli-live-tests"]

[[test]]
name = "servers_tests"
required-features = ["cli-live-tests"]

[[test]]
name = "shares_tests"
required-features = ["cli-live-tests"]

[[test]]
name = "sync_tests"
required-features = ["cli-live-tests"]

[[test]]
name = "transfer_tests"
required-features = ["cli-live-tests"]

[lints]
workspace = true
