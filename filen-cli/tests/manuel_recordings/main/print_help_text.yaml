- !Output "\r\n\e[?2004l\r\e[1m\e[4mUsage\e[0m\r\n\r\nWelcome to Filen CLI v\e[33m\e[1m{{ version }}\e[0m!\r\n\r\nYou can find out more about the Filen CLI at https://github.com/FilenCloudDienste/filen-cli-releases\r\n\r\nInvoke the Filen CLI with no command specified to enter interactive mode (REPL).\r\nThere, you can specify absolute paths (starting with \"/\") or relative paths (supports \".\" and \"..\").\r\nThe REPL keeps the lines you enter in `repl_history` in the config directory, except those that\r\ngive a password or another secret, and those that pass arguments on to rclone.\r\n\r\nWithout a terminal on stdin, it runs the commands piped into it instead, one per line,\r\nand exits with the code of the last one that failed.\r\n\r\nA command asks at the terminal for what it needs and was not given, such as a password or a\r\nconfirmation. When stdin is not a terminal, as with `filen rm -p file < list` or commands piped\r\nin, it asks at the controlling terminal instead (`/dev/tty`, or the console on Windows), as git\r\nand ssh do. `--yes` answers every yes/no question with yes without asking, from confirmations\r\nsuch as `rm -p`'s to \"Enable download?\", \"Keep me logged in?\" and the offer of an update, but\r\nnot what `sync` asks about deletions it held back (see `help sync-deletions-and-conflicts`).\r\nQuestions that ask for a value, such as a password or a choice from a list, still need a\r\nterminal or the option that gives it. `--no-input` never asks. A question that cannot be asked,\r\nwith `--no-input` or without any terminal, fails the command with exit code 2, naming the option\r\nthat answers it instead where there is one.\r\n\r\nOptions can go before or after the command (`filen --json ls` or `filen ls --json`),\r\nexcept for `--password` and `--two-factor-code`, which go before it. After `filen rclone`,\r\neverything goes to Rclone as it is, so the CLI's options go before `rclone`.\r\nIn the REPL, a line can add `--json`, `--quiet`, `-v` or `--yes` for its own command.\r\n\r\n\e[1m\e[4mOptions\e[0m\r\n\r\n\e[2m→\e[0m \e[32m-v\e[0m, \e[32m--verbose\e[0m\e[32m...\e[0m\r\n  Increase verbosity (-v, -vv, -vvv)\r\n\e[2m→\e[0m \e[32m-q\e[0m, \e[32m--quiet\e[0m\r\n  Hide progress bars and other non-essential output (overrides -v)\r\n\e[2m→\e[0m \e[32m--config-dir\e[0m\e[32m \e[0m\e[32m<CONFIG_DIR>\e[0m\r\n  Config directory, created if missing (overrides system default; FILEN_CLI_DATA_DIR also sets it) \e[2m[env: \e[0m\e[2mFILEN_CLI_CONFIG_DIR=\e[0m\e[2m]\e[0m \e[2m[aliases: \e[0m\e[2m--data-dir\e[0m\e[2m]\e[0m\r\n\e[2m→\e[0m \e[32m--profile\e[0m\e[32m \e[0m\e[32m<NAME>\e[0m\r\n  Use this profile: its own login, cache and logs, in a directory of the config directory (letters, digits, `-` and `_`) \e[2m[env: \e[0m\e[2mFILEN_CLI_PROFILE=\e[0m\e[2m]\e[0m\r\n\e[2m→\e[0m \e[32m--log-file\e[0m\e[32m \e[0m\e[32m<PATH>\e[0m\r\n  Append the log to this file instead of writing it to the config directory\r\n\e[2m→\e[0m \e[32m--no-log-file\e[0m\r\n  Do not write a log file\r\n\e[2m→\e[0m \e[32m-e\e[0m, \e[32m--email\e[0m\e[32m \e[0m\e[32m<EMAIL>\e[0m\r\n  Filen account email (requires --password) \e[2m[env: \e[0m\e[2mFILEN_CLI_EMAIL\e[0m\e[2m]\e[0m\r\n\e[2m→\e[0m \e[32m-p\e[0m, \e[32m--password\e[0m\e[32m \e[0m\e[32m<PASSWORD>\e[0m\r\n  Filen account password (requires --email) \e[2m[env: \e[0m\e[2mFILEN_CLI_PASSWORD\e[0m\e[2m]\e[0m\r\n\e[2m→\e[0m \e[32m-t\e[0m, \e[32m--two-factor-code\e[0m\e[32m \e[0m\e[32m<TWO_FACTOR_CODE>\e[0m\r\n  Filen account two-factor code or recovery key (optional, requires --email and --password) \e[2m[env: \e[0m\e[2mFILEN_CLI_2FA_CODE\e[0m\e[2m]\e[0m\r\n\e[2m→\e[0m \e[32m--auth-config-path\e[0m\e[32m \e[0m\e[32m<AUTH_CONFIG_PATH>\e[0m\r\n  Path to auth config file (exported via `filen export-auth-config`)\r\n\e[2m→\e[0m \e[32m--concurrency\e[0m\e[32m \e[0m\e[32m<CONCURRENCY>\e[0m\r\n  Limit concurrent API connections\r\n\e[2m→\e[0m \e[32m--requests-per-sec\e[0m\e[32m \e[0m\e[32m<REQUESTS_PER_SEC>\e[0m\r\n  Maximum number of API requests per second\r\n\e[2m→\e[0m \e[32m--upload-bandwidth-kbps\e[0m\e[32m \e[0m\e[32m<UPLOAD_BANDWIDTH_KBPS>\e[0m\r\n  Cap upload bandwidth, in kilobytes per second\r\n\e[2m→\e[0m \e[32m--download-bandwidth-kbps\e[0m\e[32m \e[0m\e[32m<DOWNLOAD_BANDWIDTH_KBPS>\e[0m\r\n  Cap download bandwidth, in kilobytes per second\r\n\e[2m→\e[0m \e[32m--memory-budget-bytes\e[0m\e[32m \e[0m\e[32m<MEMORY_BUDGET_BYTES>\e[0m\r\n  Memory budget for file I/O, in bytes\r\n\e[2m→\e[0m \e[32m--connect-timeout-secs\e[0m\e[32m \e[0m\e[32m<CONNECT_TIMEOUT_SECS>\e[0m\r\n  Connection timeout, in seconds\r\n\e[2m→\e[0m \e[32m--skip-update\e[0m\r\n  Skip checking for updates\r\n\e[2m→\e[0m \e[32m--force-update-check\e[0m\r\n  Force checking for updates\r\n\e[2m→\e[0m \e[32m--always-update\e[0m\r\n  Force checking for updates and install them automatically. Usually, updates are only installed in REPL mode\r\n\e[2m→\e[0m \e[32m--reluctant-autocomplete\e[0m\r\n  Sets autocomplete to be less eager, only completing remote paths after pressing tab\r\n\e[2m→\e[0m \e[32m--json\e[0m\r\n  Format command output as machine-readable JSON (where applicable)\r\n\e[2m→\e[0m \e[32m-y\e[0m, \e[32m--yes\e[0m\r\n  Answer yes to every yes/no question, such as `rm -p`'s confirmation\r\n\e[2m→\e[0m \e[32m--no-input\e[0m\r\n  Never prompt: fail where a prompt would be needed (pass --yes to answer confirmations)\r\n\e[2m→\e[0m \e[32m--working-path\e[0m\e[32m \e[0m\e[32m<WORKING_PATH>\e[0m\r\n  The initial working path for the REPL or non-interactive commands (defaults to \"/\")\r\n\e[2m→\e[0m \e[32m-V\e[0m, \e[32m--version\e[0m\r\n  Print version\r\n\r\n\e[1m\e[4mJSON output\e[0m\r\n\r\nWith `--json`, the CLI prints for programs to read:\r\n- A command's result goes to stdout as JSON with camelCase keys, such as\r\n  `{\"directories\": [...], \"files\": [...]}` for `filen ls --json`.\r\n- A failure goes to stderr as one line of JSON instead of text:\r\n  `{\"error\":{\"message\":\"...\",\"kind\":\"failure\",\"exitCode\":1}}`. `kind` is `failure` (the command\r\n  could not do what was asked), `usage` (the command line was invalid), `interrupted`\r\n  (Ctrl-C), `terminal_input` (a prompt could not be shown or answered) or `unexpected`\r\n  (possibly a bug, with a `reportUrl` to report it at). `exitCode` is the code the CLI exits\r\n  with, or in the REPL the code the command would have exited with.\r\n- Nothing is printed when Rclone fails, as it prints its own error, or when stdout was closed.\r\n- Warnings stay text on stderr; announcements and release notes are left out.\r\n\r\nA command line the CLI cannot parse is reported as text, as are failures to set up the config\r\ndirectory or the log file before the command runs.\r\n\r\n\e[1m\e[4mUpdates\e[0m\r\n\r\nThe CLI checks for a new release at https://github.com/FilenCloudDienste/filen-cli-releases\r\nwhen it starts, at most once every 5 minutes: `last_update_check` in the config directory keeps\r\nthe time of the last check. `--skip-update` skips the check, and `--force-update-check` checks\r\neven if the last check was less recent. `filen version` and `filen install` never check.\r\nThe check follows the release marked latest there; there is no canary or beta channel.\r\n\r\nWhat happens to a newer release depends on how the CLI runs:\r\n- In the REPL, it is offered: its release notes are shown and you are asked whether to install\r\n  it (`--yes` answers yes). If you do, the CLI installs it and restarts on it. If you decline, it\r\n  is offered again after the next check.\r\n- With a command, or with commands piped in, the check runs while they run, and a newer release\r\n  is announced after them, saying to update from the REPL.\r\n- `--always-update` checks even if the last check was less recent, and installs a newer release\r\n  without asking, also with a command, after it. The command still runs on the release the CLI\r\n  started with, and the new one is used from the next run on. In the REPL, the CLI restarts on\r\n  it.\r\n- In the Docker image, the CLI never replaces itself, not even with `--always-update`: a newer\r\n  release is announced with the image to pull (`docker pull filen/cli:<version>`).\r\n\r\nAn update replaces the executable in place. If the executable's file name contains its version,\r\nthe new release is saved under a name with the new version instead, and the old executable is\r\ndeleted. The download is checked against the size its release lists.\r\n\r\n`filen install latest` installs the latest release, and `filen install vX.Y.Z` a given one, also\r\nan older one (to go back to it) or the running one again, after showing its release notes and\r\nasking to confirm (`--yes` confirms). It does not work in the Docker image, where you pull the\r\nimage of the release instead. After going back to an older release, the REPL offers the latest\r\none again with each check: pass `--skip-update` to keep running the older one without the offer.\r\n\r\nAnnouncements for the running version, published with the releases, are shown with each check.\r\nUpdate notices, release notes and announcements are printed to stderr, and only when stdout is a\r\nterminal and neither `--json` nor `--quiet` is given. A failed update check (for example when\r\noffline) does not stop the command: it is printed as a warning to stderr, except with `--json`\r\nor `--quiet`, and written to the log.\r\n\r\n\e[1m\e[4mConfig directory\e[0m\r\n\r\nThe CLI keeps its files in a config directory. By default, that is `filen-cli` in the\r\nplatform's config directory:\r\n- Linux: `$XDG_CONFIG_HOME/filen-cli`, or `~/.config/filen-cli`\r\n- macOS: `~/Library/Application Support/filen-cli`\r\n- Windows: `%APPDATA%\\filen-cli`\r\n\r\n`--config-dir <dir>` uses another directory, and so does its alias `--data-dir`, the\r\nenvironment variable `FILEN_CLI_CONFIG_DIR`, or else `FILEN_CLI_DATA_DIR`. The directory is\r\ncreated if it is missing. `filen version` prints the one in use.\r\n\r\nIt holds:\r\n- `logs/`: the log files (see `help log-files`)\r\n- `filen-cli-auth-config.txt`: an auth config, which logging in reads (see `help auth`). The\r\n  CLI writes one there when you choose to after the system keyring could not keep your\r\n  credentials; `filen export-auth-config` writes one to the current directory instead\r\n- `filen-sdk-rs-cache`: the cache of the drive's metadata that `sync` keeps\r\n- `sync-engine.db`: the state of each sync pair `sync` has run\r\n- `syncPairs.yaml`, or `syncPairs.json` as the older CLI wrote it: the sync pairs `sync` runs\r\n  when it is given none (you write it)\r\n- `rclone/`: the managed rclone, and the state and the file cache of the rclone that `mount`\r\n  and `serve` run\r\n- `uploads/`: the records of unfinished uploads `upload --resume` continues (see\r\n  `help transfers`)\r\n- `repl_history`: the lines entered in the REPL\r\n- `last_update_check`: the time of the last update check (see `help updates`)\r\n- `ts_migration_hint_shown`: present once the CLI has pointed out the older CLI's files\r\n- `profiles/`: a config directory of its own for each profile `--profile` named (see\r\n  `help profile-option`), used instead of this one while that profile is\r\n\r\nCredentials you choose to keep when logging in are stored in the system keyring, not in the\r\nconfig directory.\r\n\r\n\e[1m\e[4mLog files\e[0m\r\n\r\nThe CLI writes a log of what it does besides what it prints, at debug level, whatever `-v`\r\nor `--quiet` is given. By default, it goes to `logs/` in the config directory (see\r\n`help config-dir`):\r\n- `latest.log` holds the latest run, emptied when the CLI starts\r\n- `<date>.log` holds every run of that day\r\n- a file larger than 10 MiB is moved aside to `<name>.old` (`.old1`, `.old2`, ...) and started\r\n  anew\r\n- the files are deleted once they were last written more than 3 days ago, and the oldest\r\n  first while together they hold more than 100 MiB\r\n\r\n`--log-file <path>` appends the log to that file instead, which the CLI never moves, empties or\r\ndeletes. `--no-log-file` writes no log. `-v`, `-vv` and `-vvv` also print the log to stderr,\r\nat info, debug and trace level.\r\n\r\nWhat the CLI prints is not logged, except failures and announcements. Prompts are logged with\r\nthe answers to yes/no questions and selections, but not text answers or passwords; a REPL line\r\nis logged as its command name only.\r\n\r\n\e[1m\e[4mExit codes\e[0m\r\n\r\nThe Filen CLI exits with:\r\n- `0` when the command succeeded,\r\n- `1` when it failed, with the error printed to stderr,\r\n- `2` when the command line was invalid, such as an unknown command or flags that do not go together,\r\n- `0` too when stdout was closed first, as `head` closes it once it has its lines, except\r\n  while the command was writing a file's content to stdout (`cat`, `head`, `tail`,\r\n  `download <file> -`), where the reader did not get all of it: `1`,\r\n- `130` when Ctrl-C, SIGTERM or SIGHUP cancelled the command or quit the CLI,\r\n- the exit code of Rclone when `filen rclone ...` failed in Rclone, or 128 plus the signal when a signal ended it.\r\n\r\n\e[1m\e[4mCommands\e[0m\r\n\r\n┃ \e[4m\e[32mhelp\e[0m [COMMAND_OR_TOPIC]\r\n┃ Print help about a command or topic (default: general help)\r\n┃ \e[2m→\e[0m \e[32m[COMMAND_OR_TOPIC]\e[0m  Command or topic to show help about\r\n\r\n┃ \e[4m\e[32mview-html-docs\e[0m\r\n┃ View the documentation (same as --help) locally in a browser rendered as HTML\r\n\r\n┃ \e[4m\e[32mexit\e[0m\r\n┃ Exit the REPL\r\n\r\n┃ \e[4m\e[32mversion\e[0m\r\n┃ Print the version of the CLI, the platform it was built for and its config directory\r\n\r\n┃ \e[4m\e[32minstall\e[0m <latest|vX.Y.Z>\r\n┃ Install a release of the CLI in place of this one, also an older one\r\n┃ \e[2m→\e[0m \e[32m<latest|vX.Y.Z>\e[0m  \"latest\", or the version to install, such as v\e[33m\e[1m{{ version }}\e[0m\r\n\r\n┃ \e[4m\e[32mcompletions\e[0m <SHELL>\r\n┃ Print a script that completes the CLI's commands and options in a shell (see the install lines in `help shell-completions`)\r\n┃ \e[2m→\e[0m \e[32m<SHELL>\e[0m  The shell to print the completion script for \e[2m[possible values: \e[0m\e[2mbash\e[0m\e[2m, \e[0m\e[2melvish\e[0m\e[2m, \e[0m\e[2mfish\e[0m\e[2m, \e[0m\e[2mpowershell\e[0m\e[2m, \e[0m\e[2mzsh\e[0m\e[2m]\e[0m\r\n\r\n`filen completions <shell>` prints a script that completes the CLI's commands and options in\r\nbash, zsh, fish, PowerShell or elvish. Remote paths are completed in the REPL only. Install the\r\nscript once, then open a new shell:\r\n- bash: `filen completions bash > ~/.local/share/bash-completion/completions/filen`\r\n- zsh: `filen completions zsh > ~/.zfunc/_filen`, with `fpath+=~/.zfunc` before `compinit` in\r\n  `~/.zshrc`\r\n- fish: `filen completions fish > ~/.config/fish/completions/filen.fish`\r\n- PowerShell: add `filen completions powershell | Out-String | Invoke-Expression` to `$PROFILE`\r\n- elvish: add `eval (filen completions elvish | slurp)` to `~/.config/elvish/rc.elv`\r\n\r\nPowerShell and elvish load the script each time a shell starts. For bash, zsh and fish, install\r\nit again after an update, so that it completes the new release's commands.\r\n\r\n┃ \e[4m\e[32mlcd\e[0m <DIRECTORY>\r\n┃ Change the local working directory, which local paths start from (in REPL)\r\n┃ \e[2m→\e[0m \e[32m<DIRECTORY>\e[0m  Local directory to change into (supports \"~\")\r\n\r\n┃ \e[4m\e[32mlpwd\e[0m\r\n┃ Print the local working directory\r\n\r\n┃ \e[4m\e[32mlls\e[0m [DIRECTORY]\r\n┃ List the files in a local directory, hidden ones too\r\n┃ \e[2m→\e[0m \e[32m[DIRECTORY]\e[0m  Local directory to list (default: the local working directory; supports \"~\")\r\n\r\n\e[1m\e[4mMore help topics\e[0m\r\n\r\n\e[4mAuthentication\e[0m  \e[2m→\e[0m \e[32mhelp auth\e[0m\r\n\e[4mAccount\e[0m  \e[2m→\e[0m \e[32mhelp account\e[0m\r\n\e[4mAccessing Files\e[0m  \e[2m→\e[0m \e[32mhelp access-files\e[0m\r\n\e[4mTransferring Files\e[0m  \e[2m→\e[0m \e[32mhelp transfer-files\e[0m\r\n\e[4mSharing\e[0m  \e[2m→\e[0m \e[32mhelp sharing\e[0m\r\n\e[4mNotes\e[0m  \e[2m→\e[0m \e[32mhelp notes\e[0m\r\n\e[4mManaged Rclone\e[0m  \e[2m→\e[0m \e[32mhelp managed-rclone\e[0m\r\n\e[4mMigrating from the TypeScript CLI\e[0m  \e[2m→\e[0m \e[32mhelp migration\e[0m\r\n\e[?2004h\e[1m\e[34m(manuel)\e[0m "
