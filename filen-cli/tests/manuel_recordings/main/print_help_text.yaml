# The check follows the release marked latest there; there is no canary or beta channel.     #
#                                                                                            #
# What happens to a newer release depends on how the CLI runs:                               #
# - In the REPL, it is offered: its release notes are shown and you are asked whether to ins #
# tall                                                                                       #
#   it (`--yes` answers yes). If you do, the CLI installs it and restarts on it. If you decl #
# ine, it                                                                                    #
#   is offered again after the next check.                                                   #
# - With a command, or with commands piped in, the check runs while they run, and a newer re #
# lease                                                                                      #
#   is announced after them, saying to update from the REPL.                                 #
# - `--always-update` checks even if the last check was less recent, and installs a newer re #
# lease                                                                                      #
#   without asking, also with a command, after it. The command still runs on the release the #
#  CLI                                                                                       #
#   started with, and the new one is used from the next run on. In the REPL, the CLI restart #
# s on                                                                                       #
#   it.                                                                                      #
# - In the Docker image, the CLI never replaces itself, not even with `--always-update`: a n #
# ewer                                                                                       #
#   release is announced with the image to pull (`docker pull filen/cli:<version>`).         #
#                                                                                            #
# An update replaces the executable in place. If the executable's file name contains its ver #
# sion,                                                                                      #
# the new release is saved under a name with the new version instead, and the old executable #
#  is                                                                                        #
# deleted. The download is checked against the size its release lists.                       #
#                                                                                            #
# `filen install latest` installs the latest release, and `filen install vX.Y.Z` a given one #
# , also                                                                                     #
# an older one (to go back to it) or the running one again, after showing its release notes  #
# and                                                                                        #
# asking to confirm (`--yes` confirms). It does not work in the Docker image, where you pull #
#  the                                                                                       #
# image of the release instead. After going back to an older release, the REPL offers the la #
# test                                                                                       #
# one again with each check: pass `--skip-update` to keep running the older one without the  #
# offer.                                                                                     #
#                                                                                            #
# Announcements for the running version, published with the releases, are shown with each ch #
# eck.                                                                                       #
# Update notices, release notes and announcements are printed to stderr, and only when stdou #
# t is a                                                                                     #
# terminal and neither `--json` nor `--quiet` is given. A failed update check (for example w #
# hen                                                                                        #
# offline) does not stop the command: it is printed as a warning to stderr, except with `--j #
# son`                                                                                       #
# or `--quiet`, and written to the log.                                                      #
#                                                                                            #
# Config directory                                                                           #
#                                                                                            #
# The CLI keeps its files in a config directory. By default, that is `filen-cli` in the      #
# platform's config directory:                                                               #
# - Linux: `$XDG_CONFIG_HOME/filen-cli`, or `~/.config/filen-cli`                            #
# - macOS: `~/Library/Application Support/filen-cli`                                         #
# - Windows: `%APPDATA%\filen-cli`                                                           #
#                                                                                            #
# `--config-dir <dir>` uses another directory, and so does its alias `--data-dir`, the       #
# environment variable `FILEN_CLI_CONFIG_DIR`, or else `FILEN_CLI_DATA_DIR`. The directory i #
# s                                                                                          #
# created if it is missing. `filen version` prints the one in use.                           #
#                                                                                            #
# It holds:                                                                                  #
# - `logs/`: the log files (see `help log-files`)                                            #
# - `filen-cli-auth-config.txt`: an auth config, which logging in reads (see `help auth`). T #
# he                                                                                         #
#   CLI writes one there when you choose to after the system keyring could not keep your     #
#   credentials; `filen export-auth-config` writes one to the current directory instead      #
# - `filen-sdk-rs-cache`: the cache of the drive's metadata that `sync` keeps                #
# - `sync-engine.db`: the state of each sync pair `sync` has run                             #
# - `syncPairs.yaml`, or `syncPairs.json` as the older CLI wrote it: the sync pairs `sync` r #
# uns                                                                                        #
#   when it is given none (you write it)                                                     #
# - `rclone/`: the managed rclone, and the state and the file cache of the rclone that `moun #
# t`                                                                                         #
#   and `serve` run                                                                          #
# - `uploads/`: the records of unfinished uploads `upload --resume` continues (see           #
#   `help transfers`)                                                                        #
# - `repl_history`: the lines entered in the REPL                                            #
# - `last_update_check`: the time of the last update check (see `help updates`)              #
# - `ts_migration_hint_shown`: present once the CLI has pointed out the older CLI's files    #
# - `profiles/`: a config directory of its own for each profile `--profile` named (see       #
#   `help profile-option`), used instead of this one while that profile is                   #
#                                                                                            #
# Credentials you choose to keep when logging in are stored in the system keyring, not in th #
# e                                                                                          #
# config directory.                                                                          #
#                                                                                            #
# Log files                                                                                  #
#                                                                                            #
# The CLI writes a log of what it does besides what it prints, at debug level, whatever `-v` #
# or `--quiet` is given. By default, it goes to `logs/` in the config directory (see         #
# `help config-dir`):                                                                        #
# - `latest.log` holds the latest run, emptied when the CLI starts                           #
# - `<date>.log` holds every run of that day                                                 #
# - a file larger than 10 MiB is moved aside to `<name>.old` (`.old1`, `.old2`, ...) and sta #
# rted                                                                                       #
#   anew                                                                                     #
# - the files are deleted once they were last written more than 3 days ago, and the oldest   #
#   first while together they hold more than 100 MiB                                         #
#                                                                                            #
# `--log-file <path>` appends the log to that file instead, which the CLI never moves, empti #
# es or                                                                                      #
# deletes. `--no-log-file` writes no log. `-v`, `-vv` and `-vvv` also print the log to stder #
# r,                                                                                         #
# at info, debug and trace level.                                                            #
#                                                                                            #
# What the CLI prints is not logged, except failures and announcements. Prompts are logged w #
# ith                                                                                        #
# the answers to yes/no questions and selections, but not text answers or passwords; a REPL  #
# line                                                                                       #
# is logged as its command name only.                                                        #
#                                                                                            #
# Exit codes                                                                                 #
#                                                                                            #
# The Filen CLI exits with:                                                                  #
# - `0` when the command succeeded,                                                          #
# - `1` when it failed, with the error printed to stderr,                                    #
# - `2` when the command line was invalid, such as an unknown command or flags that do not g #
# o together,                                                                                #
# - `0` too when stdout was closed first, as `head` closes it once it has its lines, except  #
#   while the command was writing a file's content to stdout (`cat`, `head`, `tail`,         #
#   `download <file> -`), where the reader did not get all of it: `1`,                       #
# - `130` when Ctrl-C, SIGTERM or SIGHUP cancelled the command or quit the CLI,              #
# - the exit code of Rclone when `filen rclone ...` failed in Rclone, or 128 plus the signal #
#  when a signal ended it.                                                                   #
#                                                                                            #
# Commands                                                                                   #
#                                                                                            #
# ┃ help [COMMAND_OR_TOPIC]                                                                  #
# ┃ Print help about a command or topic (default: general help)                              #
# ┃ → [COMMAND_OR_TOPIC]  Command or topic to show help about                                #
#                                                                                            #
# ┃ view-html-docs                                                                           #
# ┃ View the documentation (same as --help) locally in a browser rendered as HTML            #
#                                                                                            #
# ┃ exit                                                                                     #
# ┃ Exit the REPL                                                                            #
#                                                                                            #
# ┃ version                                                                                  #
# ┃ Print the version of the CLI, the platform it was built for and its config directory     #
#                                                                                            #
# ┃ install <latest|vX.Y.Z>                                                                  #
# ┃ Install a release of the CLI in place of this one, also an older one                     #
# ┃ → <latest|vX.Y.Z>  "latest", or the version to install, such as v{{ version }}           #
#                                                                                            #
# ┃ completions <SHELL>                                                                      #
# ┃ Print a script that completes the CLI's commands and options in a shell (see the install #
#  lines in `help shell-completions`)                                                        #
# ┃ → <SHELL>  The shell to print the completion script for [possible values: bash, elvish,  #
# fish, powershell, zsh]                                                                     #
#                                                                                            #
# `filen completions <shell>` prints a script that completes the CLI's commands and options  #
# in                                                                                         #
# bash, zsh, fish, PowerShell or elvish. Remote paths are completed in the REPL only. Instal #
# l the                                                                                      #
# script once, then open a new shell:                                                        #
# - bash: `filen completions bash > ~/.local/share/bash-completion/completions/filen`        #
# - zsh: `filen completions zsh > ~/.zfunc/_filen`, with `fpath+=~/.zfunc` before `compinit` #
#  in                                                                                        #
#   `~/.zshrc`                                                                               #
# - fish: `filen completions fish > ~/.config/fish/completions/filen.fish`                   #
# - PowerShell: add `filen completions powershell | Out-String | Invoke-Expression` to `$PRO #
# FILE`                                                                                      #
# - elvish: add `eval (filen completions elvish | slurp)` to `~/.config/elvish/rc.elv`       #
#                                                                                            #
# PowerShell and elvish load the script each time a shell starts. For bash, zsh and fish, in #
# stall                                                                                      #
# it again after an update, so that it completes the new release's commands.                 #
#                                                                                            #
# ┃ lcd <DIRECTORY>                                                                          #
# ┃ Change the local working directory, which local paths start from (in REPL)               #
# ┃ → <DIRECTORY>  Local directory to change into (supports "~")                             #
#                                                                                            #
# ┃ lpwd                                                                                     #
# ┃ Print the local working directory                                                        #
#                                                                                            #
# ┃ lls [DIRECTORY]                                                                          #
# ┃ List the files in a local directory, hidden ones too                                     #
# ┃ → [DIRECTORY]  Local directory to list (default: the local working directory; supports " #
# ~")                                                                                        #
