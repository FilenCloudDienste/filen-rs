- !Output "\r\n\e[?2004l\r\e[1m\e[4mAuthentication\e[0m\r\n\r\nThe CLI logs in with the first of these that it finds:\r\n1. the CLI arguments `--email` and `--password`, optionally `--two-factor-code`,\r\n   or the environment variables `FILEN_CLI_EMAIL`, `FILEN_CLI_PASSWORD` and `FILEN_CLI_2FA_CODE`\r\n   (when none of these is set, the variables `FILEN_EMAIL`, `FILEN_PASSWORD` and\r\n   `FILEN_2FA_CODE` of the old Filen CLI are used; when a two-factor code is required\r\n   and not given, you are prompted for it; the recovery key is accepted as the code too)\r\n\r\n   To log in to an account with two-factor authentication without anyone to type a code,\r\n   set `FILEN_CLI_2FA_SECRET` to its TOTP secret (the key your authenticator app was set up with):\r\n   the CLI then makes the code itself. Keep in mind that anyone who can read the CLI's\r\n   environment then has your second factor too, which defeats two-factor authentication\r\n   on that machine.\r\n2. an auth config file, exported with `filen export-auth-config`: the one given with\r\n   `--auth-config-path`, or else `./filen-cli-auth-config.txt` (in the current working\r\n   directory), then `filen-cli-auth-config.txt` in the config dir\r\n   (on Linux and macOS, an auth config found in these two places must not be accessible\r\n   to other users: restrict it with `chmod 600`)\r\n3. the login kept in the system keychain (each config dir keeps a login of its own there)\r\n4. credentials saved by the old Filen CLI, which are imported\r\n   (its `.filen-cli-auth-config` in the current working directory or its data directory,\r\n   and, with the default config dir, the login it kept; its files are left as they are)\r\n5. otherwise, you are prompted for your email and password (with three attempts)\r\n\r\nAfter logging in by 4. or 5., you can keep the login in the system keychain,\r\nor, where there is none (such as in the Docker image), in an auth config file in the config dir.\r\n\r\nThe config dir is the one given with `--config-dir`, or by default:\r\n- Linux: `$XDG_CONFIG_HOME/filen-cli`, or `~/.config/filen-cli` without it\r\n- macOS: `~/Library/Application Support/filen-cli`\r\n- Windows: `%APPDATA%\\filen-cli`\r\n\r\n(development builds use `filen-cli-dev` instead)\r\n\r\n┃ \e[4m\e[32mwhoami\e[0m\r\n┃ Print the email of the account you are logged in as\r\n\r\n┃ \e[4m\e[32mexport-auth-config\e[0m [PATH]\r\n┃ Export an auth config (to be used with --auth-config-path option), after confirming the risk (--yes answers)\r\n┃ \e[2m→\e[0m \e[32m[PATH]\e[0m  The file to write, or a directory to write filen-cli-auth-config.txt into (defaults to the current working directory)\r\n\r\n┃ \e[4m\e[32mlogout\e[0m\r\n┃ Delete saved credentials, including the --auth-config-path file, and exit, asking before each (--yes deletes them all); then offer to delete the local cache\r\n\r\n`2fa enable` turns on two-factor authentication: it prints a secret (and an `otpauth://` URL with\r\nit) to add to your authenticator app, asks for a code from the app (or takes it with `--code`),\r\nand prints the recovery key, which logs you in without a code: store it somewhere safe.\r\nWith `--json`, the secret and the recovery key are printed as `{\"secret\", \"recoveryKey\"}`, and\r\nthe secret is shown on stderr before the code is asked for. `2fa disable` turns it off again,\r\nwith a code or the recovery key. Both ask to confirm, which `--yes` does. The login the CLI\r\nkeeps stays valid.\r\n\r\n`change-password` asks for your current password and the new one (twice), and changes it.\r\nThe login the CLI keeps is updated with it: the system keychain's, or the auth config file you\r\nlogged in with. A password given with `--password` or the environment has to be updated where\r\nyour scripts set it (and a login this config dir keeps as well, if it is of the same account,\r\nstops working: the CLI says so), and logins kept elsewhere (another config dir, another device,\r\nan exported auth config, the old Filen CLI's saved login) may stop working.\r\n\r\n`change-email <new email>` asks for your password and requests the change: Filen sends an\r\nemail to confirm it, and the change happens once you confirm it. Then log in again (with\r\n`logout`, or with the new `--email` in your scripts), so that the kept login has the new email.\r\n\r\n`export-master-keys` prints your master keys, which decrypt all your files, after you confirm\r\nit (which `--yes` does). Keep them where only you can read them.\r\n\r\n┃ \e[4m\e[32m2fa\e[0m <COMMAND>\r\n┃ Enable or disable two-factor authentication\r\n\r\n┃ \e[4m\e[32mchange-password\e[0m\r\n┃ Change your password, and update the kept login (asks for the current and the new password)\r\n\r\n┃ \e[4m\e[32mchange-email\e[0m <NEW_EMAIL>\r\n┃ Request to change your email, which Filen asks you to confirm by email (asks for your password)\r\n┃ \e[2m→\e[0m \e[32m<NEW_EMAIL>\e[0m  The new email\r\n\r\n┃ \e[4m\e[32mexport-master-keys\e[0m\r\n┃ Print your master keys, which decrypt all your files, after confirming it (--yes answers)\r\n\r\n`--profile <name>` (or `FILEN_CLI_PROFILE`) uses the profile `<name>`: its own config dir,\r\n`profiles/<name>` in the config dir, which is created the first time it is used. A profile has\r\nits own login (in the system keychain or an auth config file), cache, logs and sync pairs, so\r\nthat you can stay logged in to several accounts at once. A profile name consists of letters,\r\ndigits, `-` and `_`.\r\n\r\n`profiles` lists the profiles, marking the one in use with `*`. With `--json`, it prints them as\r\nan array of `{\"name\", \"active\"}`.\r\n\r\n┃ \e[4m\e[32mprofiles\e[0m\r\n┃ List the profiles (see --profile), marking the one in use\r\n\e[?2004h\e[1m\e[34m(manuel)\e[0m "
