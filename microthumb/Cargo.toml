[package]
name = "microthumb"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
heif = ["dep:heif-decoder"]
# SVG rasterisation. Off by default: it pulls resvg/usvg into builds that only
# ever see camera formats.
svg = ["dep:resvg", "dep:roxmltree", "dep:num-traits"]

[dependencies]
image = { version = "0.25.6", default-features = false, features = [
	"bmp",
	"gif",
	"qoi",
	"tiff",
	"webp",
] }
gif = "0.13"
# `default-features = false` drops the `rayon` feature, and WITHOUT it
# jpeg-decoder's baseline path hands every MCU row to a spawned worker thread
# over an unbounded mpsc channel: the entropy decoder outruns the IDCT worker,
# the queue grows, and the live coefficient rows blow the budget (a 60 MP
# source peaked at 27 MB against a 12 MB budget on a loaded machine). With the
# feature on, `Worker::append_row` runs the IDCT inline on the calling thread —
# exactly the one-MCU-row-band cost `formats::jpeg::full_decode_peak` charges.
# Off on wasm, where jpeg-decoder compiles its rayon worker out anyway.
jpeg-decoder = { version = "0.3.2", default-features = false }
tiff = "0.10"
png = "0.18"
heif-decoder = { path = "../heif-decoder", optional = true }
resvg = { version = "0.48", default-features = false, optional = true }
# Pinned to the exact version usvg 0.48 locks: the expansion pre-pass reads the
# document with the same parser usvg will, and adds nothing to the lockfile.
roxmltree = { version = "0.21.1", optional = true }
# Float-to-int conversions (ToPrimitive) without a truncating `as`, which the workspace lints deny.
num-traits = { version = "0.2.19", optional = true }

# See the jpeg-decoder note above: the rayon worker is what keeps the baseline
# JPEG decode to one MCU row at a time. filen-sdk-rs already drives rayon's
# global pool (`multi-threaded-crypto`), so this shares that pool instead of
# spawning a thread per component per decode.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
jpeg-decoder = { version = "0.3.2", features = ["rayon"] }

[dev-dependencies]
# Synthetic fixtures are generated at test runtime — encoders only. The RAW
# characterisation suite instead pins real sample files by hash and fetches
# them with `curl`; `blake3` verifies them. See tests/raw_fixtures/.
blake3 = "1.8"
image = { version = "0.25.6", default-features = false, features = [
	"bmp",
	"gif",
	"jpeg",
	"png",
	"qoi",
	"tiff",
	"webp",
] }
jpeg-encoder = { version = "0.7", default-features = false }

[lints]
workspace = true
